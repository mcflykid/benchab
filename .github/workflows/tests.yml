name: Tests unitaires

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CADGEN_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.7'
      - run: uv sync --locked
      - run: uv run python -m benchab.qualite.frontiere --racine .
      - run: uv run ruff check .
      - name: Vérifier la présence et la mise en forme des docstrings du paquet
        run: uv run ruff check --select D10,D200,D202,D204,D205,D207,D208,D209,D211,D212,D300,D400,D403 benchab
      - name: Contrôler les annotations publiques modifiées
        env:
          BENCHAB_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Le commit initial est couvert par le contrôle des docstrings du paquet.
          if ! git rev-parse --verify --quiet "$GITHUB_SHA^1" >/dev/null; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            BENCHAB_BASE=$(git rev-parse --verify "$GITHUB_SHA^1")
          fi
          uv run python -m benchab.qualite.annotations --base "$BENCHAB_BASE" --tete "$GITHUB_SHA" --racine .
      - name: Vérifier les types des modules communs
        run: uv run --locked --group typage python -m mypy
      - name: Run uv run pytest -q
        run: |
          uv run pytest -q -o junit_family=xunit1 -o junit_logging=no -o junit_log_passing_tests=false \
            --junitxml="$RUNNER_TEMP/benchab-junit-$GITHUB_RUN_ATTEMPT.xml"
      - name: Tester aussi la lecture PDF avec son extra
        run: uv run --locked --extra pdf pytest -q tests/test_lecture_pdf.py
      - name: Publier le JUnit de la tentative
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/benchab-junit-${{ github.run_attempt }}.xml
          archive: false
          if-no-files-found: error
          retention-days: 14
