name: Tests unitaires

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CADGEN_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.7'
      - run: uv sync --locked
      - run: uv run python -m benchab.qualite.frontiere --racine .
      - run: uv run ruff check .
      - name: Vérifier la présence des docstrings publiques du paquet
        run: uv run ruff check --select D10 benchab
      - name: Contrôler les annotations publiques modifiées
        env:
          BENCHAB_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            BENCHAB_BASE=$(git rev-parse --verify "$GITHUB_SHA^1")
          fi
          uv run python -m benchab.qualite.annotations --base "$BENCHAB_BASE" --tete "$GITHUB_SHA" --racine .
      - name: Vérifier les types des modules communs
        run: uv run --locked --group typage python -m mypy
      - run: uv run pytest -q
      - name: Tester aussi la lecture PDF avec son extra
        run: uv run --locked --extra pdf pytest -q tests/test_lecture_pdf.py
