__PREPARATIONS__
<section class="carte" id="atelierDepot">
  <h2>Ouvrir un modèle</h2>
  <form id="atelierImport">
    <p><label for="atelierFichier">Choisir ou déposer un modèle 3D</label></p>
    <input type="file" id="atelierFichier" accept=".stl,.obj,.3mf" required>
    <p id="atelierChoixUnites" hidden><label for="atelierUnites">Unités du modèle</label>
      <select id="atelierUnites">
        <option value="">Choisir</option><option value="mm">Millimètres</option>
        <option value="cm">Centimètres</option><option value="m">Mètres</option>
      </select>
    </p>
    <details><summary>Limiter les mesures</summary>
      <label>Plaque <input type="number" min="1" step="1" id="atelierPlaqueImport"></label>
      <label>Pièce <input type="number" min="1" step="1" id="atelierPieceImport"></label>
    </details>
    <button id="atelierAnalyser" hidden>Analyser le modèle</button>
    <button type="button" id="atelierAnnuler" hidden>Annuler</button>
    <p id="atelierEtat" role="status"></p>
  </form>
</section>
<details class="carte">
  <summary>Créer une pièce paramétrique</summary>
  <form id="atelierParametres" action="/bibliotheque-atelier" method="get">
    <label>Modèle <select name="modele"><option value="boite">Boîte avec couvercle</option>
      <option value="clip">Clip à languette</option><option value="temoin">Témoin de jeux</option>
      <option value="fixation">Plat de fixation à deux trous</option></select></label>
    <label>Cote de référence (mm) <input type="number" name="cote" min="8" max="80" step="0.1" value="20" required></label>
    <label>Jeu de la boîte ou du clip (mm) <input type="number" name="jeu" min="0.1" max="0.6" step="0.05" value="0.3" required></label>
    <button>Examiner la pièce</button>
    <button name="sortie" value="stl">Télécharger le STL</button>
    <button name="sortie" value="json">Télécharger la fiche des cotes</button>
    <button type="button" id="atelierEnregistrerConception">Enregistrer cette version</button>
    <p id="atelierEtatConception" role="status"></p>
  </form>
  <label for="atelierHistorique">Reprendre une version enregistrée</label>
  <select id="atelierHistorique"><option value="">Choisir</option></select>
  <p id="atelierLiensConception"></p>
</details>
<script type="application/json" id="atelierVersions">__VERSIONS_CONCEPTION__</script>
<script>
// Les versions viennent de l’atelier privé ; changer de navigateur ne casse pas la filiation.
const parametres = document.getElementById('atelierParametres');
const historique = document.getElementById('atelierHistorique');
const liensConception = document.getElementById('atelierLiensConception');
let jeux = JSON.parse(document.getElementById('atelierVersions').textContent);
let parentConception = null;
function afficherHistorique() {
  historique.replaceChildren(new Option('Choisir', ''));
  jeux.forEach(jeu => {
    const famille = parametres.elements.namedItem('modele').querySelector('option[value="' + jeu.modele + '"]');
    const cotes = jeu.cote + ' mm' + (['boite', 'clip'].includes(jeu.modele) ? ' · jeu ' + jeu.jeu + ' mm' : '');
    historique.add(new Option(famille.textContent + ' · ' + cotes, jeu.id));
  });
}
function afficherLiensConception() {
  liensConception.replaceChildren();
  if (!parentConception) return;
  const id = encodeURIComponent(parentConception);
  const apercu = document.createElement('a');
  apercu.href = '/conceptions/bibliotheque/' + id + '/atelier.html';
  apercu.textContent = 'Ouvrir l’aperçu enregistré';
  const stl = document.createElement('a');
  stl.href = '/bibliotheque-atelier?version=' + id + '&sortie=stl';
  stl.textContent = 'Télécharger le STL enregistré';
  liensConception.append(apercu, ' · ', stl);
}
historique.onchange = () => {
  const jeu = jeux.find(version => version.id === historique.value);
  parentConception = jeu?.id || null;
  if (jeu) for (const cle of ['modele', 'cote', 'jeu']) parametres.elements.namedItem(cle).value = jeu[cle];
  afficherLiensConception();
};
parametres.elements.namedItem('modele').onchange = () => {
  parentConception = null;
  historique.value = '';
  afficherLiensConception();
};
afficherHistorique();
document.getElementById('atelierEnregistrerConception').onclick = async e => {
  if (!parametres.reportValidity()) return;
  const bouton = e.currentTarget, etat = document.getElementById('atelierEtatConception');
  const jeu = Object.fromEntries(new FormData(parametres));
  bouton.disabled = true;
  try {
    const reponse = await fetch('/__conception_enregistrer', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({modele: jeu.modele, cote: Number(jeu.cote), jeu: Number(jeu.jeu),
        parent: parentConception}),
    });
    const resultat = await reponse.json();
    if (!reponse.ok) throw new Error(resultat.erreur);
    parentConception = resultat.id;
    jeux = [{...jeu, id: resultat.id}, ...jeux].slice(0, 12);
    afficherHistorique();
    historique.value = resultat.id;
    afficherLiensConception();
    etat.textContent = 'Version enregistrée dans l’atelier privé.';
  } catch (erreur) {
    etat.textContent = erreur.message;
  } finally {
    bouton.disabled = false;
  }
};

// L’envoi reste sur le serveur local ; le fichier choisi n’est jamais remplacé.
const formulaire = document.getElementById('atelierImport');
const fichier = document.getElementById('atelierFichier');
const unites = document.getElementById('atelierUnites');
const depot = document.getElementById('atelierDepot');
const bouton = document.getElementById('atelierAnalyser');
const annuler = document.getElementById('atelierAnnuler');
const statut = document.getElementById('atelierEtat');
const choixUnites = document.getElementById('atelierChoixUnites');
let analyse;
function modeleChoisi() {
  if (analyse || !fichier.files.length) return;
  const est3mf = fichier.files[0].name.toLowerCase().endsWith('.3mf');
  choixUnites.hidden = est3mf;
  bouton.hidden = est3mf;
  if (est3mf) formulaire.requestSubmit();
  else {
    statut.textContent = 'Choisissez les unités indiquées par l’auteur du modèle.';
    unites.focus();
  }
}
fichier.addEventListener('change', modeleChoisi);
async function signalerAnnulation(enCours) {
  if (enCours !== analyse || enCours.signalEnCours || enCours.annulationRecue) return;
  enCours.signalEnCours = true;
  try {
    const reponse = await fetch('/__preparation_annuler', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({analyse: enCours.id}),
    });
    enCours.annulationRecue = reponse.ok && (await reponse.json()).annulation_demandee;
  } catch (_erreur) {
    // Le suivi réessaie tant que le serveur n’a pas confirmé la demande.
  } finally {
    enCours.signalEnCours = false;
  }
}
annuler.onclick = () => {
  if (!analyse || analyse.annulation) return;
  analyse.annulation = true;
  annuler.disabled = true;
  statut.textContent = 'Arrêt demandé. Attente de la fin de l’analyse…';
  void signalerAnnulation(analyse);
};
depot.addEventListener('dragover', e => e.preventDefault());
depot.addEventListener('drop', e => {
  e.preventDefault();
  if (analyse) return;
  if (e.dataTransfer.files.length === 1) {
    fichier.files = e.dataTransfer.files;
    modeleChoisi();
  } else statut.textContent = 'Déposez un seul modèle à la fois.';
});
formulaire.addEventListener('submit', async e => {
  e.preventDefault();
  if (analyse) return;
  const modèle = fichier.files[0];
  if (!modèle) return;
  if (!modèle.name.toLowerCase().endsWith('.3mf') && !unites.value) {
    statut.textContent = 'Choisissez les unités du STL ou de l’OBJ.'; unites.focus(); return;
  }
  if (modèle.size > 128 * 1024 * 1024) { statut.textContent = 'Le fichier dépasse 128 Mio.'; return; }
  bouton.disabled = true;
  fichier.disabled = true;
  annuler.disabled = false;
  annuler.hidden = false;
  const enCours = {id: crypto.randomUUID(), annulation: false};
  analyse = enCours;
  statut.textContent = 'Analyse en cours…';
  const suivre = setInterval(async () => {
    if (analyse !== enCours) return;
    // On garde la requête ouverte jusqu’à la libération du serveur, même si l’arrêt
    // a été demandé avant l’enregistrement de l’analyse côté serveur.
    if (enCours.annulation) return signalerAnnulation(enCours);
    try {
      const reponse = await fetch('/__preparation_progression', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({analyse: enCours.id}),
      });
      const etat = await reponse.json();
      if (analyse === enCours && !enCours.annulation && etat.active) {
        statut.textContent = etat.etape + (etat.total ? ' · ' + etat.finies + '/' + etat.total : '…');
      }
    } catch (_erreur) { /* L’import principal rapporte son propre état. */ }
  }, 750);
  try {
    const requete = new URLSearchParams({nom: modèle.name, unites: unites.value, analyse: enCours.id,
      plaque: document.getElementById('atelierPlaqueImport').value,
      piece: document.getElementById('atelierPieceImport').value});
    const réponse = await fetch('/__preparation?' + requete, {
      method: 'POST', headers: {'Content-Type': 'application/octet-stream'}, body: modèle,
    });
    if (!réponse.ok) throw new Error((await réponse.json()).erreur || 'Analyse interrompue.');
    const html = await réponse.text();
    // Le document généré garde la même origine, pour les ressources et préférences locales.
    if (!enCours.annulation) { document.open(); document.write(html); document.close(); }
  } catch (erreur) {
    bouton.hidden = false;
    if (!enCours.annulation) statut.textContent = erreur.message + ' Vous pouvez relancer l’analyse.';
  } finally {
    clearInterval(suivre);
    bouton.disabled = false;
    fichier.disabled = false;
    annuler.hidden = true;
    analyse = null;
    if (enCours.annulation) {
      fichier.value = '';
      bouton.hidden = true;
      choixUnites.hidden = true;
      statut.textContent = 'Analyse arrêtée. Choisissez ou déposez un autre modèle.';
      fichier.focus();
    }
  }
});
</script>
