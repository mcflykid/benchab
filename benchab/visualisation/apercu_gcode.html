<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu G-code</title><style>
:root{--fond:#14161c;--panneau:#1e2129;--texte:#e8e8ea;--doux:#9aa0aa;--accent:#ffb347;--bord:#2e323c}
body{margin:0;background:var(--fond);color:var(--texte);font:14px/1.4 -apple-system,Segoe UI,sans-serif;display:flex;height:100vh;overflow:hidden}
#vue{flex:1;position:relative}canvas{width:100%;height:100%;display:block;cursor:crosshair}
#cote{width:290px;background:var(--panneau);border-left:1px solid var(--bord);padding:12px;overflow:auto;box-sizing:border-box}
h1{font-size:15px;margin:0 0 4px}small,.doux{color:var(--doux)}label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pastille{width:12px;height:12px;border-radius:3px;display:inline-block}input[type=range]{width:100%}
button,select{background:#2a2e38;color:var(--texte);border:1px solid var(--bord);border-radius:6px;padding:4px 8px;cursor:pointer}
#info{position:absolute;left:10px;top:10px;background:#000a;padding:6px 10px;border-radius:6px;pointer-events:none}
#clic{margin-top:8px;padding:8px;background:#2a2e38;border-radius:6px;display:none}.def{color:#ff6b6b;cursor:pointer}
#vue3d{flex:1;position:relative;display:none}#vue3d canvas{cursor:grab}.al{color:#ffb347;cursor:pointer}.onglets button.actif{background:var(--accent);color:#000}
@media(max-width:700px){body{flex-direction:column}#cote{width:100%;height:45vh}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="vue"><canvas id="c"></canvas><div id="info"></div></div><div id="vue3d"><div id="info3d" style="position:absolute;left:10px;top:10px;background:#000a;padding:6px 10px;border-radius:6px;pointer-events:none"></div></div><div id="cote">
<h1>__TITRE__</h1><small>Aperçu du fichier tranché, couche par couche. Temps par couche : estimation grossière (sans accélérations).</small>
<p class="onglets"><button id="o2d" class="actif">Dessus (couche)</button> <button id="o3d">3D</button></p>
<p><select id="plaque"></select> <button id="recadrer">Recadrer</button></p>
<div id="ctl3d" style="display:none"><p class="doux">3D : couches affichées jusqu'à la couche courante (curseur ci-dessous) à partir de :</p>
<input type="range" id="bas" min="0" value="0"><small id="basz"></small>
<p><label><input type="checkbox" id="rubans" checked> rubans en volume (<input id="nrub" type="number" value="15" min="1" max="200" style="width:48px"> dernières couches)</label>
<label><input type="checkbox" id="trajets" checked> déplacements à vide (rouge : ≥ 40 mm et relevés &lt; 1 mm)</label>
<label><input type="checkbox" id="voiral" checked> alertes des contrôles</label>
<label>couleur <select id="mode"><option value="type">par type</option><option value="vitesse">par vitesse</option></select></label></p>
<div id="legv" class="doux"></div><div id="als"></div></div>
<p>Couche <b id="num"></b> — Z <b id="z"></b> mm<br><input type="range" id="couche" min="0" value="0"><br>
<button id="moins">◀</button> <button id="plus">▶</button> <small>(flèches du clavier)</small></p>
<label><input type="checkbox" id="prec" checked> couche précédente en grisé</label>
<p class="doux">Types (cliquer pour masquer)</p><div id="types"></div>
<div id="defs"></div><div id="clic"></div></div>
<script>
const echapper=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=__DONNEES__;const cv=document.getElementById('c'),cx=cv.getContext('2d');let P=0,L=0,vue=null,cache={};const masque=new Set();
function lignes(k){const id=P+':'+k;if(cache[id])return cache[id];const b=atob(D.plaques[P].couches[k].d),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return cache[id]=new Int16Array(u.buffer)}
function bornes(){let a=[1e9,1e9,-1e9,-1e9];const C=D.plaques[P].couches;for(let k=0;k<C.length;k+=Math.max(1,C.length>>4)){const d=lignes(k);let i=0;while(i<d.length){const n=d[i+1];for(let j=0;j<=n;j++){const x=d[i+2+2*j],y=d[i+3+2*j];if(x<a[0])a[0]=x;if(y<a[1])a[1]=y;if(x>a[2])a[2]=x;if(y>a[3])a[3]=y}i+=4+2*n}}return a.map(v=>v/D.q)}
function recadrer(){const b=bornes(),w=cv.clientWidth,h=cv.clientHeight,s=0.9*Math.min(w/(b[2]-b[0]||1),h/(b[3]-b[1]||1));vue={s,ox:w/2-s*(b[0]+b[2])/2,oy:h/2+s*(b[1]+b[3])/2};dessiner()}
const ecran=(x,y)=>[vue.ox+vue.s*x,vue.oy-vue.s*y],monde=(u,v)=>[(u-vue.ox)/vue.s,(vue.oy-v)/vue.s];
function trace(k,gris){const d=lignes(k);let i=0;cx.lineWidth=Math.max(1,0.42*vue.s);cx.lineCap='round';cx.lineJoin='round';while(i<d.length){const t=d[i],n=d[i+1];if(!masque.has(t)){cx.strokeStyle=gris?'#555a':D.couleurs[t];cx.beginPath();for(let j=0;j<=n;j++){const p=ecran(d[i+2+2*j]/D.q,d[i+3+2*j]/D.q);j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])}cx.stroke()}i+=4+2*n}}
function dessiner(){const r=devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;cx.setTransform(r,0,0,r,0,0);cx.fillStyle='#14161c';cx.fillRect(0,0,cv.width,cv.height);if(!vue)return;
 const C=D.plaques[P].couches,c=C[L];if(document.getElementById('prec').checked&&L>0)trace(L-1,true);trace(L,false);
 if(L===0)for(const f of D.plaques[P].defauts){const p=ecran(f.xy[0],f.xy[1]);cx.strokeStyle='#ff3b3b';cx.lineWidth=2;cx.beginPath();cx.arc(p[0],p[1],Math.max(10,3*vue.s),0,7);cx.stroke()}
 let cum=0;for(let k=0;k<=L;k++)cum+=C[k].t;document.getElementById('num').textContent=(L+1)+' / '+C.length;document.getElementById('z').textContent=c.z.toFixed(2);
 document.getElementById('info').textContent='Z '+c.z.toFixed(2)+' mm · couche '+c.h.toFixed(2)+' mm · ≈ '+fmt(c.t)+' (cumul ≈ '+fmt(cum)+')'}
const fmt=s=>s<60?Math.round(s)+' s':s<3600?Math.floor(s/60)+' min '+String(Math.round(s%60)).padStart(2,'0'):Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0');
function aller(k){const C=D.plaques[P].couches;L=Math.max(0,Math.min(C.length-1,k));document.getElementById('couche').value=L;dessiner();window.maj3d&&window.maj3d()}
function plaque(k){P=k;cache={};const C=D.plaques[P].couches;const s=document.getElementById('couche');s.max=C.length-1;L=0;s.value=0;
 const ds=D.plaques[P].defauts;document.getElementById('defs').innerHTML=ds.length?'<p class="doux">Défauts de 1re couche (contrôle premiere_couche)</p>'+ds.map(f=>'<div class="def">● '+echapper(f.type+' — '+f.aire_mm2+' mm² (X '+f.xy[0]+', Y '+f.xy[1]+')')+'</div>').join(''):'';
 document.querySelectorAll('.def').forEach((e,i)=>e.onclick=()=>{aller(0);const f=ds[i];vue.s=Math.max(vue.s,12);vue.ox=cv.clientWidth/2-vue.s*f.xy[0];vue.oy=cv.clientHeight/2+vue.s*f.xy[1];dessiner()});recadrer();window.plaque3d&&window.plaque3d()}
const sel=document.getElementById('plaque');D.plaques.forEach((p,i)=>sel.add(new Option('Plaque '+p.n,i)));sel.onchange=()=>plaque(+sel.value);
const ty=document.getElementById('types');D.types.forEach((t,i)=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox" checked><span class="pastille" style="background:'+D.couleurs[i]+'"></span>'+t;l.querySelector('input').onchange=e=>{e.target.checked?masque.delete(i):masque.add(i);dessiner()};ty.appendChild(l)});
document.getElementById('couche').oninput=e=>aller(+e.target.value);document.getElementById('moins').onclick=()=>aller(L-1);document.getElementById('plus').onclick=()=>aller(L+1);
document.getElementById('prec').onchange=dessiner;document.getElementById('recadrer').onclick=recadrer;
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){aller(L+1);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){aller(L-1);e.preventDefault()}});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015),r=cv.getBoundingClientRect(),u=e.clientX-r.left,v=e.clientY-r.top;vue.ox=u-(u-vue.ox)*f;vue.oy=v-(v-vue.oy)*f;vue.s*=f;dessiner()},{passive:false});
let glisse=null;cv.onmousedown=e=>glisse={x:e.clientX,y:e.clientY,ox:vue.ox,oy:vue.oy,bouge:false};
addEventListener('mousemove',e=>{if(!glisse)return;const dx=e.clientX-glisse.x,dy=e.clientY-glisse.y;if(Math.abs(dx)+Math.abs(dy)>3)glisse.bouge=true;vue.ox=glisse.ox+dx;vue.oy=glisse.oy+dy;dessiner()});
addEventListener('mouseup',e=>{if(glisse&&!glisse.bouge){const r=cv.getBoundingClientRect(),m=monde(e.clientX-r.left,e.clientY-r.top),z=D.plaques[P].couches[L].z,t='Plaque '+D.plaques[P].n+', couche '+(L+1)+' : X '+m[0].toFixed(1)+' Y '+m[1].toFixed(1)+' Z '+z.toFixed(2);
 const b=document.getElementById('clic');b.style.display='block';b.innerHTML=t+'<br><button id="cp">Copier</button>';document.getElementById('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(t)}glisse=null});
addEventListener('resize',dessiner);window.apercu={D,aller,plaque,get couche(){return L},get plaqueIndex(){return P}};plaque(0);
</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const A=window.apercu,D=A.D,box=document.getElementById('vue3d'),$=i=>document.getElementById(i);let ren,scene,cam,ctl,G=null,actif=false;
const b64=(s,T)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)};
const vit=v=>{const t=Math.min(1,v/300);return new THREE.Color().setHSL(.66-.66*t,.9,.5)};
function init(){ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(ren.domElement);scene=new THREE.Scene();scene.background=new THREE.Color('#14161c');
 cam=new THREE.PerspectiveCamera(40,1,.5,5000);ctl=new OrbitControls(cam,ren.domElement);scene.add(new THREE.AmbientLight(0xffffff,.7));const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(1,2,1.5);scene.add(d);
 addEventListener('resize',taille);(function boucle(){requestAnimationFrame(boucle);if(actif){ctl.update();ren.render(scene,cam)}})()}
function taille(){if(!ren)return;const w=box.clientWidth,h=box.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
// G-code (x, y, z) → three (x, z, −y) : Z du G-code vers le haut.
function construire(){if(G){scene.remove(G.groupe);G.groupe.traverse(o=>{o.geometry&&o.geometry.dispose()})}const C=D.plaques[A.plaqueIndex].couches,q=D.q,mode=$('mode').value;
 let n=0,nt=0;const dec=C.map(c=>{const d=b64(c.d,Int16Array),v=b64(c.v,Uint8Array),tr=b64(c.tr,Int16Array);let i=0,s=0;while(i<d.length){s+=d[i+1];i+=4+2*d[i+1]}n+=s;nt+=tr.length/5;return {d,v,tr,s}});
 const pos=new Float32Array(n*6),col=new Float32Array(n*6),deb=[],tp=new Float32Array(nt*6),tc=new Float32Array(nt*6),tdeb=[];let k=0,kt=0,vmax=1;
 C.forEach((c,ci)=>{deb.push(k);tdeb.push(kt);const {d,v,tr}=dec[ci],z=c.z;let i=0,p=0;while(i<d.length){const ty=d[i],m=d[i+1],sp=v[p++]||0;vmax=Math.max(vmax,sp);const co=mode==='type'?new THREE.Color(D.couleurs[ty]):vit(sp);
  for(let j=0;j<m;j++){const a=i+2+2*j;pos.set([d[a]/q,z,-d[a+1]/q,d[a+2]/q,z,-d[a+3]/q],k*6);col.set([co.r,co.g,co.b,co.r,co.g,co.b],k*6);k++}i+=4+2*m}
  for(let j=0;j<tr.length;j+=5){const x0=tr[j]/q,y0=tr[j+1]/q,x1=tr[j+2]/q,y1=tr[j+3]/q,le=tr[j+4]/q,L=Math.hypot(x1-x0,y1-y0),r=L>=40&&le<1;tp.set([x0,z+le,-y0,x1,z+le,-y1],kt*6);const co=r?[1,.2,.2]:[.45,.45,.5];tc.set([...co,...co],kt*6);kt++}});
 deb.push(k);tdeb.push(kt);const groupe=new THREE.Group();
 const g1=new THREE.BufferGeometry();g1.setAttribute('position',new THREE.BufferAttribute(pos,3));g1.setAttribute('color',new THREE.BufferAttribute(col,3));const lignes=new THREE.LineSegments(g1,new THREE.LineBasicMaterial({vertexColors:true}));
 const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.BufferAttribute(tp,3));g2.setAttribute('color',new THREE.BufferAttribute(tc,3));const trajets=new THREE.LineSegments(g2,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.8}));
 groupe.add(lignes,trajets);const al=new THREE.Group();groupe.add(al);g1.computeBoundingBox();const bb=g1.boundingBox;
 for(const a of D.plaques[A.plaqueIndex].alertes||[]){const b=a.bbox||[bb.min.x,-bb.max.z,bb.max.x,-bb.min.z],h=Math.max(.2,a.z[1]-a.z[0]),geo=new THREE.BoxGeometry(Math.max(1,b[2]-b[0]),h,Math.max(1,b[3]-b[1]));
  const m=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:a.bbox?0xffb347:0xff3bd2}));m.position.set((b[0]+b[2])/2,(a.z[0]+a.z[1])/2,-(b[1]+b[3])/2);al.add(m)}
 for(const f of D.plaques[A.plaqueIndex].defauts||[]){const m=new THREE.Mesh(new THREE.SphereGeometry(1.5,12,8),new THREE.MeshBasicMaterial({color:0xff3b3b}));m.position.set(f.xy[0],C[0].z,-f.xy[1]);al.add(m)}
 const rub=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),60000);rub.count=0;groupe.add(rub);
 scene.add(groupe);G={groupe,lignes,trajets,al,rub,deb,tdeb,pos,col,C,vmax,bb};
 $('legv').textContent=mode==='vitesse'?'Vitesse : bleu lent → rouge ≥ 300 mm/s (max de la plaque '+vmax+' mm/s)':'';
 const ls=D.plaques[A.plaqueIndex].alertes||[];$('als').innerHTML=ls.length?'<p class="doux">Alertes des contrôles (clic : aller à la couche)</p>'+ls.map(a=>'<div class="al">● '+echapper(a.texte)+'</div>').join(''):'<p class="doux">Aucune alerte de contrôle fournie.</p>';
 document.querySelectorAll('.al').forEach((e,i)=>e.onclick=()=>{const a=ls[i],ci=C.findIndex(c=>c.z>=a.z[1]-1e-6);A.aller(ci<0?C.length-1:ci);if(a.bbox)ctl.target.set((a.bbox[0]+a.bbox[2])/2,a.z[0],-(a.bbox[1]+a.bbox[3])/2)});
 $('bas').max=C.length-1;cadrer();maj()}
function cadrer(){const b=G.bb,c=new THREE.Vector3();b.getCenter(c);const r=b.getSize(new THREE.Vector3()).length();ctl.target.copy(c);/* 27/10/2026 : distance selon le plus petit angle de vue (une vue étroite coupait la plaque) */const v=THREE.MathUtils.degToRad(cam.fov),h=2*Math.atan(Math.tan(v/2)*cam.aspect);cam.position.copy(c).addScaledVector(new THREE.Vector3(.7,.6,.9).normalize(),(r/2)/Math.sin(Math.min(v,h)/2)*1.08);cam.near=r/500;cam.far=r*20;cam.updateProjectionMatrix()}
function maj(){if(!G||!actif)return;const L=A.couche,B=Math.min(+$('bas').value,L),C=G.C;$('basz').textContent=' couche '+(B+1)+', Z '+C[B].z.toFixed(2)+' mm';
 G.lignes.geometry.setDrawRange(G.deb[B]*2,(G.deb[L+1]-G.deb[B])*2);G.trajets.visible=$('trajets').checked;G.trajets.geometry.setDrawRange(G.tdeb[B]*2,(G.tdeb[L+1]-G.tdeb[B])*2);
 G.al.visible=$('voiral').checked;G.al.children.forEach(m=>{const y=m.position.y;m.visible=y<=C[L].z+.01&&y>=C[B].z-5});
 const rb=G.rub,N=Math.max(1,+$('nrub').value||15),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),co=new THREE.Color();let n=0;
 if($('rubans').checked)for(let ci=Math.max(B,L-N+1);ci<=L&&n<rb.instanceMatrix.count;ci++){const h=C[ci].h;for(let s=G.deb[ci];s<G.deb[ci+1]&&n<rb.instanceMatrix.count;s++){const p=G.pos,o=s*6,dx=p[o+3]-p[o],dz=p[o+5]-p[o+2],l=Math.hypot(dx,dz);if(l<1e-3)continue;
  e.set(0,-Math.atan2(dz,dx),0);q.setFromEuler(e);m.compose(new THREE.Vector3((p[o]+p[o+3])/2,p[o+1]-h/2,(p[o+2]+p[o+5])/2),q,new THREE.Vector3(l,h,.42));rb.setMatrixAt(n,m);co.setRGB(G.col[o],G.col[o+1],G.col[o+2]);rb.setColorAt(n,co);n++}}
 rb.count=n;rb.instanceMatrix.needsUpdate=true;if(rb.instanceColor)rb.instanceColor.needsUpdate=true;
 $('info3d').textContent='Couches '+(B+1)+'–'+(L+1)+' · Z '+C[B].z.toFixed(2)+'–'+C[L].z.toFixed(2)+' mm · '+(G.deb[L+1]-G.deb[B]).toLocaleString('fr')+' segments'+(n?' · '+n.toLocaleString('fr')+' en volume':'')}
function onglet(t){actif=t==='3d';$('vue').style.display=actif?'none':'';box.style.display=actif?'block':'none';$('ctl3d').style.display=actif?'':'none';$('o3d').classList.toggle('actif',actif);$('o2d').classList.toggle('actif',!actif);
 if(actif){if(!ren)init();taille();if(!G)construire();maj()}}
$('o2d').onclick=()=>onglet('2d');$('o3d').onclick=()=>onglet('3d');['bas','rubans','trajets','voiral','nrub'].forEach(i=>$(i).addEventListener('input',maj));$('mode').onchange=construire;
window.maj3d=maj;window.plaque3d=()=>{G&&scene.remove(G.groupe);G=null;if(actif)construire()};window.apercu3d={onglet,get etat(){return G&&{segments:G.deb[G.deb.length-1],trajets:G.tdeb[G.tdeb.length-1],alertes:G.al.children.length,rubans:G.rub.count}}};
</script></body></html>
